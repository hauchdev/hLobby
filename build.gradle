plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = '1.0.0'
group = 'dev.hauch.hlobby'

ext {
    // Velocity API version comes from gradle.properties (managed by Devix).
    velocityVersion = project.api_version
    faststatsVersion = '0.30.2'
    junitVersion = '5.11.4'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'faststatsReleases'; url = 'https://repo.faststats.dev/releases' }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${velocityVersion}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocityVersion}"

    // FastStats anonymous usage metrics (relocated at build time).
    implementation "dev.faststats.metrics:velocity:${faststatsVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The API is compile-only for the plugin itself but tests need the types
    // and their transitive dependencies on the test classpath.
    testImplementation "com.velocitypowered:velocity-api:${velocityVersion}"

    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// The shadow jar is the publishable artifact: it contains the relocated
// dependencies and is named without a classifier.
shadowJar {
    archiveClassifier = ''
    relocate 'dev.faststats', "${project.group}.libs.faststats"
    mergeServiceFiles()
}

tasks.named('jar') {
    archiveClassifier = 'dev'
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.named('check') {
    dependsOn test
}
